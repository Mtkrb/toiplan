<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ToiPlan — организация тоев</title>
    <style>
      :root {
        --bg: #4a0412;
        --bg2: #2e020b;
        --card: #650c20;
        --line: #8a2a3c;
        --gold: #e8b94a;
        --gold2: #f6e0a0;
        --red: #c8102e;
        --tx: #fbeed0;
        --mut: #d9b9a0;
        color-scheme: dark;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: radial-gradient(
            circle at 50% 0,
            var(--bg) 0,
            var(--bg2) 100%
          )
          fixed;
        color: var(--tx);
        font:
          16px/1.45 Georgia,
          "Times New Roman",
          serif;
        min-height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
        background: rgba(46, 2, 11, 0.7);
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--gold);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
        cursor: pointer;
      }
      nav {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-left: auto;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 14px;
      }
      button,
      .btn {
        min-height: 44px;
        padding: 8px 16px;
        border-radius: 10px;
        border: 1px solid var(--gold);
        background: transparent;
        color: var(--gold2);
        font: inherit;
        cursor: pointer;
      }
      button.p {
        background: linear-gradient(180deg, var(--gold2), var(--gold));
        color: var(--bg2);
        font-weight: 700;
        border: 0;
      }
      button.d {
        border-color: var(--red);
        color: #ff9aa8;
      }
      button.sm {
        min-height: 36px;
        padding: 4px 10px;
        font-size: 14px;
      }
      button.act {
        background: var(--gold);
        color: var(--bg2);
      }
      input,
      select,
      textarea {
        width: 100%;
        min-height: 44px;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--bg2);
        color: var(--tx);
        font: inherit;
      }
      label {
        display: block;
        font-size: 14px;
        color: var(--mut);
        margin: 8px 0 4px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        margin: 10px 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }
      .num {
        font-size: 28px;
        color: var(--gold);
        font-weight: 700;
      }
      .mut {
        color: var(--mut);
        font-size: 14px;
      }
      h1,
      h2,
      h3 {
        color: var(--gold2);
        margin: 8px 0;
      }
      h1 {
        font-size: 24px;
      }
      .tabs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 4px 0;
      }
      .tabs button {
        white-space: nowrap;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .row > * {
        flex: 1 1 140px;
      }
      .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 99px;
        font-size: 13px;
        border: 1px solid var(--gold);
        color: var(--gold2);
      }
      .yes {
        background: #2f6b3a;
        border-color: #2f6b3a;
        color: #fff;
      }
      .no {
        background: var(--red);
        border-color: var(--red);
        color: #fff;
      }
      .soon {
        border-style: dashed;
        opacity: 0.75;
      }
      .over {
        color: #ff9aa8;
      }
      .chat {
        height: 340px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 6px;
      }
      .m {
        max-width: 85%;
        padding: 8px 12px;
        border-radius: 12px;
      }
      .m.u {
        align-self: flex-end;
        background: var(--gold);
        color: var(--bg2);
      }
      .m.a {
        align-self: flex-start;
        background: var(--bg2);
        border: 1px solid var(--line);
      }
      .wrap {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      td,
      th {
        padding: 8px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      .ornament {
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--gold),
          transparent
        );
        margin: 6px 0;
      }
      .note {
        font-size: 13px;
        color: var(--mut);
        text-align: center;
        padding: 14px;
      }
      .hero {
        text-align: center;
        padding: 18px 8px;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      h1,
      h2,
      h3,
      .logo {
        font-family: Georgia, serif;
      }
      button {
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      button:hover {
        transform: translateY(-1px);
      }
      button.p:hover {
        box-shadow: 0 6px 20px rgba(232, 185, 74, 0.35);
      }
      .card {
        transition: border-color 0.2s;
      }
      .card:hover {
        border-color: var(--gold);
      }
      .lp section {
        padding: 36px 0;
      }
      .lp h2 {
        font-size: 28px;
        text-align: center;
      }
      .sub {
        color: var(--mut);
        text-align: center;
        max-width: 560px;
        margin: 0 auto 20px;
      }
      .h2c {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 24px;
        align-items: center;
        padding: 30px 0;
      }
      @media (max-width: 760px) {
        .h2c {
          grid-template-columns: 1fr;
          text-align: center;
        }
        .h2c .row {
          justify-content: center;
        }
      }
      .big {
        font-size: clamp(30px, 6vw, 52px);
        line-height: 1.1;
        margin: 10px 0;
        background: linear-gradient(90deg, var(--gold2), var(--gold));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .f3 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }
      .ico {
        font-size: 28px;
      }
      .step {
        counter-increment: s;
      }
      .step:before {
        content: counter(s);
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--gold);
        color: var(--bg2);
        font-weight: 700;
        margin-bottom: 6px;
      }
      details {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        margin: 8px 0;
      }
      summary {
        cursor: pointer;
        color: var(--gold2);
        font-weight: 600;
      }
      .live {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #5bd16f;
        margin-right: 6px;
        animation: pl 1.5s infinite;
      }
      @keyframes pl {
        50% {
          opacity: 0.3;
        }
      }
      .fi {
        animation: fi 0.5s;
      }
      @keyframes fi {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: var(--gold);
        color: var(--bg2);
        padding: 10px 18px;
        border-radius: 99px;
        font-weight: 700;
        z-index: 20;
        animation: fi 0.3s;
      }
      .bar {
        height: 10px;
        border-radius: 9px;
        background: var(--bg2);
        overflow: hidden;
        margin: 8px 0;
      }
      .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--gold), var(--gold2));
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo" onclick="go('events')">
        <svg width="34" height="34" viewBox="0 0 100 100">
          <circle
            cx="50"

            r="46"
            fill="#4a0412"
            stroke="#e8b94a"

          />
          <circle
            cx="50"

            r="38"

          <path

            fill="none"

            stroke-width="4"
          />
          <path
            d="M30 62Q50 22 70 62"
            fill="none"
            stroke="#c8102e"

            stroke="#f6e0a0"

        >ToiPlan
      </div>
      <nav id="nav"></nav>
    </header>
    <main id="main"></main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
      // ===== Фейковый бэкенд (в духе JSONPlaceholder) =====
      const KEY = "toiplan_demo_v1",
        D = (ms) => new Promise((r) => setTimeout(r, ms));
      const T = {
        wedding: "Свадьба",
        kyz_uzatuu: "Кыз узатуу",

        birthday: "День рождения",

        home_toi: "Домашний той",
        corporate: "Корпоратив",
        other: "Другое",
      };
      const GS = { pending: "Ждём ответа", yes: "Придёт", no: "Не придёт" };
      const EC = {
        hall: "Зал",
        food: "Еда",
        host: "Ведущий",
        photo_video: "Фото и видео",
        music: "Музыка",
        transport: "Транспорт",
        clothes: "Наряды",
        decor: "Декор",
        other: "Другое",
      };
      const VC = {
        hall: "Банкетные залы",
        host: "Ведущие",
        photographer: "Фотографы",
        videographer: "Видеографы",
        musician: "Музыканты",
        show: "Шоу-программы",
        cook: "Выездные повара",
        helpers: "Помощники",
        rental: "Аренда",
        decor: "Декор",
        transport: "Транспорт",
      };
      const LS = {
        new: "Новая",
        sent: "Передана подрядчику",
        answered: "Ответ получен",
      };
      function seed() {
        const V = [
          ["hall", "Банкет-холл Ала-Тоо", "Первомайский", 2500, 5000],
          ["host", "Ведущий Адилет", "Октябрьский", 30000, 60000],
          ["photographer", "Фотостудия Алтын", "Ленинский", 20000, 45000],
          ["videographer", "Видео Мурас", "Свердловский", 25000, 70000],
          ["musician", "Группа Ай-Суу", "Первомайский", 15000, 40000],
          ["show", "Шоу Тулпар", "Октябрьский", 20000, 55000],
          ["cook", "Повар Бакыт", "Ленинский", 12000, 30000],
          ["helpers", "Помощники Дастан", "Свердловский", 6000, 12000],
          ["rental", "Аренда Кыят: казаны, шатры", "Первомайский", 5000, 80000],
          ["decor", "Декор Бермет", "Октябрьский", 18000, 90000],
          ["transport", "Лимузины Бишкек", "Ленинский", 8000, 25000],
        ];
        return {
          users: [
            {
              id: 1,
              name: "Айжан",
              email: "demo@toiplan.kg",
              password: "demo12345",
              role: "organizer",
              blocked: false,
            },
            {
              id: 2,
              name: "Админ",
              email: "admin@toiplan.kg",
              password: "admin12345",
              role: "admin",
              blocked: false,
            },
          ],
          events: [
            {
              id: 1,
              uid: 1,
              type: "wedding",
              title: "Свадьба Айжан и Бекзата",
              date: "2026-11-20T18:00",
              place: "Ресторан Ала-Тоо, Бишкек",
              description: "Будем рады видеть вас!",
              expected_guests: 150,
              code: "K7M2QX9P",
              rsvp_open: true,
            },
          ],
          guests: [
            ["Бектур ага", "yes", 2],
            ["Айгуль эже", "yes", 3],
            ["Нурлан", "yes", 1],
            ["Асель", "no", 1],
            ["Тилек", "pending", 1],
            ["Каныбек ага", "yes", 4],
            ["Гулзат", "pending", 1],
            ["Марат", "no", 2],
          ].map((g, i) => ({
            id: i + 1,
            eid: 1,
            name: g[0],
            status: g[1],
            party_size: g[2],
            source: "manual",
          })),
          expenses: [
            {
              id: 1,
              eid: 1,
              category: "hall",
              title: "Аренда зала",
              planned: 300000,
              actual: 0,
              paid: false,
            },
            {
              id: 2,
              eid: 1,
              category: "host",
              title: "Ведущий",
              planned: 50000,
              actual: 50000,
              paid: true,
            },
            {
              id: 3,
              eid: 1,
              category: "photo_video",
              title: "Фотограф",
              planned: 40000,
              actual: 0,
              paid: false,
            },
          ],
          tasks: [
            {
              id: 1,
              eid: 1,
              title: "Заказать торт",
              due: "2026-11-01",
              done: false,
            },
            {
              id: 2,
              eid: 1,
              title: "Разослать приглашения",
              due: "2026-10-25",
              done: true,
            },
            {
              id: 3,
              eid: 1,
              title: "Выбрать наряды",
              due: "2026-10-30",
              done: false,
            },
          ],
          vendors: V.map((v, i) => ({
            id: i + 1,
            category: v[0],
            name: v[1],
            city: "Бишкек",
            district: v[2],
            price_from: v[3],
            price_to: v[4],
            phone: "+996555" + (100000 + i * 111),
            verified: i % 2 == 0,
            active: true,
          })),
          leads: [],
          msgs: [],
        };
      }
      let db;
      try {
        db = JSON.parse(localStorage.getItem(KEY));
      } catch (e) {}
      if (!db) db = seed();
      const save = () => {
        try {
          localStorage.setItem(KEY, JSON.stringify(db));
        } catch (e) {}
      };
      const nid = (a) => Math.max(0, ...a.map((x) => x.id)) + 1;
      async function req(fn, ms = 250) {
        await D(ms);
        const r = fn();
        save();
        return r;
      }
      const money = (n) =>
        Number(n || 0)
          .toLocaleString("ru-RU")
          .replace(/\s| /g, " ") + " сом";
      const fd = (s) =>
        s ? s.slice(8, 10) + "." + s.slice(5, 7) + "." + s.slice(0, 4) : "—";
      const E = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const summary = (id) => {
        const g = db.guests.filter((x) => x.eid == id),
          x = db.expenses.filter((x) => x.eid == id),
          t = db.tasks.filter((x) => x.eid == id);
        return {
          yes: g.filter((a) => a.status == "yes").length,
          no: g.filter((a) => a.status == "no").length,
          pending: g.filter((a) => a.status == "pending").length,
          people: g
            .filter((a) => a.status == "yes")
            .reduce((s, a) => s + a.party_size, 0),
          plan: x.reduce((s, a) => s + a.planned, 0),
          fact: x.reduce((s, a) => s + a.actual, 0),
          open: t.filter((a) => !a.done).length,
          done: t.filter((a) => a.done).length,
        };
      };

      // ===== Состояние и роутинг (#имя) =====
      let S = { user: null, eid: null, timer: null };
      const ev = () => db.events.find((e) => e.id == S.eid);
      const MY = () => db.events.filter((e) => e.uid == S.user.id);
      function go(v, eid) {
        if (eid) S.eid = eid;
        if (location.hash == "#" + v) render();
        else location.hash = v;
      }
      addEventListener("hashchange", render);
      async function render() {
        clearInterval(S.timer);
        const v = location.hash.slice(1) || "home",
          m = document.getElementById("main");
        if (!S.user && v != "login" && v != "home") return go("home");
        if (
          v != "home" &&
          v != "login" &&
          v != "vendor" &&
          v != "events" &&
          v != "catalog" &&
          v != "admin" &&
          !ev()
        )
          return go("events");
        nav();
        m.innerHTML = '<p class="mut">Загрузка…</p>';
        scrollTo(0, 0);
        const V = {
          home,
          login,
          vendor,
          events,
          overview,
          guests,
          budget,
          tasks,
          assistant,
          requests,
          invite,
          catalog,
          admin,
        };
        await (V[v] || login)(m);
      }
      function nav() {
        const n = document.getElementById("nav");
        if (!S.user) {
          n.innerHTML =
            '<button class="sm" onclick="go(\'login\')">Войти</button><button class="sm p" onclick="demo()">Демо</button>';
          return;
        }
        n.innerHTML = `<button class="sm" onclick="go('events')">События</button><button class="sm" onclick="go('catalog')">Каталог</button>${S.user.role == "admin" ? '<button class="sm" onclick="go(\'admin\')">Админ</button>' : ""}<button class="sm d" onclick="S.user=null;go('login')">Выйти</button>`;
      }
      const tabs = (a) => {
        const t = [
          ["overview", "Обзор"],
          ["guests", "Гости"],
          ["budget", "Расходы"],
          ["tasks", "Задачи"],
          ["assistant", "ИИ-помощник"],
          ["requests", "Заявки"],
        ];
        return `<h1>${E(ev().title)}</h1><div class="tabs">${t.map((x) => `<button class="sm ${x[0] == a ? "act" : ""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}</div><div class="ornament"></div>`;
      };

      // ===== Лендинг =====
      function toast(t) {
        const d = document.createElement("div");
        d.className = "toast";
        d.textContent = t;
        document.body.appendChild(d);
        setTimeout(() => d.remove(), 2200);
      }
      function demo() {
        S.user = db.users[0];
        S.eid = 1;
        go("overview");
      }
      function home(m) {
        const F = [
          [
            "📩",
            "Одна ссылка для гостей",
            "Отправьте в WhatsApp. Гость отвечает за 10 секунд и без регистрации.",

          [
            "📊",

            "Ответы появляются сами, сразу видно, сколько человек придёт.",

          [
            "💰",

          ],
          [
            "🤖",
            "ИИ-помощник",
            "Напишите «Добавь расход: зал 300 тысяч», вам остаётся подтвердить.",
          ],
          [
            "🏛️",
            "Каталог подрядчиков",
            "Залы, ведущие, повара и аренда: цены и контакты в одном месте.",
          ],
          [
            "✅",
            "Задачи со сроками",
            "Просроченное подсвечивается, ничего не потеряется.",
          ],
        ];
        const Q = [
          [
            "Гостям нужно регистрироваться?",
            "Нет. Гость открывает ссылку, пишет имя и нажимает «Приду» или «Не приду».",
          ],
          [
            "ИИ сам что-то меняет в данных?",
            "Нет. Сначала он показывает карточку «Я понял так…», запись появляется только после вашего подтверждения.",
          ],
          ["Сколько это стоит?", "В демо-версии всё бесплатно."],
          [
            "А сбор денег в конвертах?",
            "Кошумча — следующий этап, на сайте пока карточка «скоро».",
          ],
        ];
        const N = [
          "Бектур ага",

      }
      const addM = (role, text, vids) =>
        db.msgs.push({ id: nid(db.msgs), eid: S.eid, role, text, vids });
      async function say(t) {
        t = (t || id_("ci").value).trim();
        if (!t) return;
        pend = null;
        addM("user", t);
        const c = id_("ch");
        c.innerHTML += `<div class="m u">${E(t)}</div><div class="m a" id="th">ИИ думает…</div>`;
        c.scrollTop = 1e9;
        await D(700);
        const r = think(t);
        addM("assistant", r.text, r.vids);
        save();
        await assistant(id_("main"));
        if (r.act) {
          pend = r.act;
          id_("ac").innerHTML =
            `<div class="card" style="border-color:var(--gold)"><b>Я понял так:</b><br>${E(r.act.prev)}<div class="row" style="margin-top:8px"><button class="p" onclick="conf(1)">Подтвердить</button><button onclick="conf(0)">Отмена</button></div></div>`;
        }
      }
      function think(t) {
        const l = t.toLowerCase(),
          s = summary(S.eid);
        if (/забудь|игнорируй|удали (все|гост)|правила/.test(l))
          return {
            text: "Я не могу менять свои правила или удалять данные по такой просьбе. Могу вести гостей, расходы, задачи и подбирать подрядчиков.",
          };
        if (/погод|анекдот|курс валют|новости/.test(l))
          return {
            text: "Это вне моих задач. Я помогаю с гостями, расходами, задачами и подрядчиками.",
          };
        const gm = /\?|^(кто|сколько)/.test(l)
          ? null
          : l.match(
              /^(?:отметь,? что )?(.+?)\s+(придёт|придет|не придёт|не придет)(?:\s+с (.+))?$/,
            );
        if (gm) {
          const nm = gm[1].trim(),
            st = /^не/.test(gm[2]) ? "no" : "yes",
            f = db.guests.filter(
              (g) => g.eid == S.eid && g.name.toLowerCase().includes(nm),
            );
          if (!f.length)
            return {
              text: `Не нашёл гостя «${nm}». Назовите имя точнее или добавьте нового гостя.`,
            };
          if (f.length > 1)
            return {
              text:
                "Найдено несколько: " +
                f.map((g) => g.name).join(", ") +
                ". Кого именно?",
            };
          const ps = gm[3] ? 2 : f[0].party_size;
          return {
            text: "Готовлю изменение — подтвердите.",
            act: {
              tool: "set_guest_status",
              args: { id: f[0].id, status: st, party_size: ps },
              prev: `Изменить статус: ${f[0].name} — ${GS[st]}, человек: ${ps}`,
            },
          };
        }
        const sum = l.match(/(\d[\d\s]*)\s*(тыс|к\b)?/) || [];
        let n = sum[1] ? parseInt(sum[1].replace(/\s/g, "")) : 0;
        if (sum[2]) n *= 1000;
        if (/полмиллиона/.test(l)) n = 500000;
        if (
          /расход|купили|потратили на/.test(l) &&
          /добав|запиш|купили/.test(l)
        ) {
          if (!n) return { text: "Какая сумма расхода?" };
          const title =
            t
              .replace(/добавь расход:?|запиши расход:?/i, "")
              .replace(/\d.*$/, "")
              .trim() || "Расход";
          const cat = /зал|ресторан/.test(l)
            ? "hall"
            : /ведущ/.test(l)
              ? "host"
              : /фото/.test(l)
                ? "photo_video"
                : /музык/.test(l)
                  ? "music"
                  : /платье|наряд/.test(l)
                    ? "clothes"
                    : "other";
          return {
            text: "Готовлю запись — подтвердите.",
            act: {
              tool: "add_expense",
              args: {
                category: cat,
                title: title[0].toUpperCase() + title.slice(1),
                planned: n,
              },
              prev: `Добавить расход: ${title[0].toUpperCase() + title.slice(1)} — ${money(n)} (категория: ${EC[cat]})`,
            },
          };
        }
        if (/задач/.test(l)) {
          const title =
            t
              .replace(/запиши задачу|добавь задачу/i, "")
              .replace(/до .*$/i, "")
              .trim() || "Задача";
          return {
            text: "Готовлю задачу — подтвердите.",
            act: {
              tool: "add_task",
              args: { title },
              prev: `Добавить задачу: ${title}`,
            },
          };
        }
        if (/добавь гост/.test(l)) {
          const nm =
            t
              .replace(/добавь гостя?/i, "")
              .replace(/,.*$/, "")
              .trim() || "Гость";
          return {
            text: "Готовлю запись.",
            act: {
              tool: "add_guest",
              args: { name: nm },
              prev: `Добавить гостя: ${nm}`,
            },
          };
        }
        if (/сколько.*(придёт|придет|человек)/.test(l))
          return {
            text: `Придёт ${s.people} человек (ответили «да»: ${s.yes} гостей).`,
          };
        if (/не ответил|ждём|ждем/.test(l)) {
          const p = db.guests
            .filter((g) => g.eid == S.eid && g.status == "pending")
            .map((g) => g.name);
          return {
            text: p.length
              ? "Не ответили: " + p.join(", ")
              : "Все гости ответили.",
          };
        }
        if (/потратили|бюджет|осталось/.test(l))
          return {
            text: `Потрачено ${money(s.fact)} из запланированных ${money(s.plan)}. Осталось по плану: ${money(s.plan - s.fact)}.`,
          };
        const cats = {
          ведущ: "host",
          фотограф: "photographer",
          зал: "hall",
          повар: "cook",
          музык: "musician",
          декор: "decor",
          видео: "videographer",
        };
        for (const k in cats)
          if (l.includes(k)) {
            const f = db.vendors
              .filter(
                (v) =>
                  v.active &&
                  v.category == cats[k] &&
                  (!n || v.price_from <= n),
              )
              .slice(0, 3);
            return {
              text: f.length
                ? "Подобрал из каталога: " +
                  f
                    .map((v) => `${v.name} (от ${money(v.price_from)})`)
                    .join("; ")
                : "Подходящих подрядчиков не нашлось.",
              vids: f.map((v) => v.id),
            };
          }
        return {
          text: "Я умею вести гостей, расходы, задачи и подбирать подрядчиков. Что сделать?",
        };
      }
      async function conf(ok) {
        const a = pend;
        pend = null;
        if (ok) {
          await req(() => {
            const x = a.args;
            if (a.tool == "add_expense")
              db.expenses.push({
                id: nid(db.expenses),
                eid: S.eid,
                category: x.category,
                title: x.title,
                planned: x.planned,
                actual: 0,
                paid: false,
              });
            if (a.tool == "add_task")
              db.tasks.push({
                id: nid(db.tasks),
                eid: S.eid,
                title: x.title,
                due: null,
                done: false,
              });
            if (a.tool == "set_guest_status") {
              const g = db.guests.find((q) => q.id == x.id);
              g.status = x.status;
              g.party_size = x.party_size;
            }
            if (a.tool == "add_guest")
              db.guests.push({
                id: nid(db.guests),
                eid: S.eid,
                name: x.name,
                status: "pending",
                party_size: 1,
                source: "ai",
              });
            addM("assistant", "Готово: " + a.prev);
          }, 100);
        } else addM("assistant", "Отменено.");
        save();
        assistant(id_("main"));
      }

      // ===== Каталог и заявки =====
      let cf = { c: "", q: "", p: "" };
      async function catalog(m) {
        m.innerHTML = `<h1>Каталог подрядчиков</h1><div class="card"><div class="row"><select onchange="cf.c=this.value;vlist()"><option value="">Все категории</option>${Object.entries(
          VC,
        )
          .map(
            (x) =>
              `<option value="${x[0]}" ${cf.c == x[0] ? "selected" : ""}>${x[1]}</option>`,
          )
          .join(
            "",
          )}</select><input placeholder="Поиск по названию" value="${E(cf.q)}" oninput="cf.q=this.value;vlist()"><input type="number" placeholder="Макс. цена" value="${cf.p}" oninput="cf.p=this.value;vlist()"></div></div><div id="vl" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"></div>`;
        vlist();
      }
      function vlist() {
        const l = db.vendors.filter(
          (v) =>
            v.active &&
            (!cf.c || v.category == cf.c) &&
            v.name.toLowerCase().includes(cf.q.toLowerCase()) &&
            (!cf.p || v.price_from <= +cf.p),
        );
        id_("vl").innerHTML =
          l
            .map(
              (v) =>
                `<div class="card"><span class="badge">${VC[v.category]}</span>${v.verified ? ' <span class="badge yes">Проверено</span>' : ""}<h3>${E(v.name)}</h3><div class="mut">${v.city}, ${v.district}</div><div>от ${money(v.price_from)}</div><div class="row" style="margin-top:8px"><a class="btn" style="text-decoration:none;text-align:center;color:var(--gold2)" href="tel:${v.phone}">Позвонить</a><button class="p" onclick="vend(${v.id})">Подробнее</button></div></div>`,
            )
            .join("") || '<div class="card">Пока ничего нет</div>';
      }
      async function lead(id) {
        const l = MY();
        if (!l.length) return alert("Сначала создайте событие");
        const e = l.find((x) => x.id == S.eid) || l[0];
        const msg = prompt(
          "Сообщение подрядчику (" + e.title + ")",
          "Нужна услуга на " + e.expected_guests + " гостей",
        );
        if (msg === null) return;
        await req(() => {
          db.leads.push({
            id: nid(db.leads),
            eid: e.id,
            vid: id,
            date: e.date.slice(0, 10),
            guests: e.expected_guests,
            message: msg,
            status: "new",
          });
        });
        toast("Заявка отправлена");
      }
      let vid = null;
      function vend(i) {
        vid = i;
        go("vendor");
      }
      async function vendor(m) {
        const v = db.vendors.find((x) => x.id == vid);
        if (!v) return go("catalog");
        const sim = db.vendors
            .filter((x) => x.category == v.category && x.id != v.id && x.active)
            .slice(0, 2),
          l = MY(),
          ph = v.phone.replace(/\D/g, "");
        m.innerHTML = `<button class="sm" onclick="go('catalog')">← Каталог</button><div class="card fi"><span class="badge">${VC[v.category]}</span>${v.verified ? ' <span class="badge yes">Проверено</span>' : ""}<h1>${E(v.name)}</h1><div class="mut">${v.city}, ${E(v.district)}</div><p>${E(v.description || "Опытная команда, работаем на тоях любого формата. Детали и свободные даты уточняйте по телефону.")}</p>
<div class="grid"><div class="card"><div class="mut">Цена</div><b>от ${money(v.price_from)}${v.price_to ? " до " + money(v.price_to) : ""}</b></div><div class="card"><div class="mut">Район</div><b>${E(v.district)}</b></div><div class="card"><div class="mut">Телефон</div><b>${E(v.phone)}</b></div></div>
<div class="row" style="margin-top:10px"><a class="btn" style="text-decoration:none;text-align:center;color:var(--gold2)" href="tel:${v.phone}">Позвонить</a><a class="btn" style="text-decoration:none;text-align:center;color:var(--gold2)" target="_blank" href="https://wa.me/${ph}">WhatsApp</a></div></div>
<div class="card"><h3>Отправить заявку</h3>${l.length ? `<div class="row"><div><label>Событие</label><select id="le" onchange="const e=db.events.find(x=>x.id==this.value);id_('ld').value=e.date.slice(0,10);id_('lg').value=e.expected_guests">${l.map((e) => `<option value="${e.id}">${E(e.title)}</option>`).join("")}</select></div><div><label>Дата</label><input id="ld" type="date" value="${l[0].date.slice(0, 10)}"></div><div><label>Гостей</label><input id="lg" type="number" value="${l[0].expected_guests}"></div></div><label>Сообщение</label><textarea id="lm">Здравствуйте! Интересует ваша услуга на нашем празднике.</textarea><p></p><button class="p" onclick="sendLead(${v.id})">Отправить заявку</button>` : '<p class="mut">Сначала создайте событие.</p>'}</div>
${sim.length ? `<h3>Похожие подрядчики</h3><div class="f3">${sim.map((x) => `<div class="card"><b>${E(x.name)}</b><div class="mut">от ${money(x.price_from)}</div><p></p><button class="sm" onclick="vend(${x.id})">Открыть</button></div>`).join("")}</div>` : ""}`;
      }
      async function sendLead(id) {
        const eid = +id_("le").value;
        await req(() => {
          db.leads.push({
            id: nid(db.leads),
            eid,
            vid: id,
            date: id_("ld").value,
            guests: +id_("lg").value || 0,
            message: id_("lm").value,
            status: "new",
          });
        });
        S.eid = eid;
        toast("Заявка отправлена");
        go("requests");
      }
      function editEv() {
        const e = ev(),
          t = prompt("Название", e.title);
        if (t === null) return;
        const p = prompt("Место", e.place);
        if (p === null) return;
        const d = prompt("Дата (ГГГГ-ММ-ДД)", e.date.slice(0, 10));
        if (d === null) return;
        e.title = t || e.title;
        e.place = p || e.place;
        if (/^\d{4}-\d\d-\d\d$/.test(d)) e.date = d + e.date.slice(10);
        save();
        toast("Событие обновлено");
        render();
      }
      async function requests(m) {
        const l = db.leads.filter((x) => x.eid == S.eid);
        m.innerHTML =
          tabs("requests") +
          `<div class="card">${l.map((x) => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${E(db.vendors.find((v) => v.id == x.vid).name)}</b><span>${fd(x.date)}</span><span class="badge">${LS[x.status]}</span></div>`).join("") || "Пока ничего нет. Отправьте заявку из каталога."}</div>`;
      }

      // ===== Админ-панель =====
      async function admin(m) {
        if (S.user.role != "admin") return go("events");
        const st = {
          users: db.users.length,
          events: db.events.length,
          guests: db.guests.length,
          vendors: db.vendors.length,
          leads: db.leads.length,
          ln: db.leads.filter((x) => x.status == "new").length,
        };
        m.innerHTML = `<h1>Админ-панель</h1><div class="grid">${[
          ["Пользователи", st.users],
          ["События", st.events],
          ["Гости", st.guests],
          ["Подрядчики", st.vendors],
          ["Заявки", st.leads],
        ]
          .map(
            (x) =>
              `<div class="card"><div class="num">${x[1]}</div>${x[0]}</div>`,
          )
          .join(
            "",
          )}<div class="card" style="border-color:var(--gold)"><div class="num">${st.ln}</div>новых заявок</div></div>
<div class="card"><h3>Заявки</h3><div class="wrap"><table>${
          db.leads
            .map((x) => {
              const e = db.events.find((a) => a.id == x.eid) || {};
              return `<tr><td>${E(e.title)}</td><td>${E(db.vendors.find((v) => v.id == x.vid).name)}</td><td>${fd(x.date)}</td><td><select onchange="req(()=>{db.leads.find(a=>a.id==${x.id}).status=this.value},50)">${Object.entries(
                LS,
              )
                .map(
                  (s) =>
                    `<option value="${s[0]}" ${x.status == s[0] ? "selected" : ""}>${s[1]}</option>`,
                )
                .join("")}</select></td></tr>`;
            })
            .join("") || "<tr><td>Заявок пока нет</td></tr>"
        }</table></div></div>
<div class="card"><h3>Пользователи</h3><div class="wrap"><table>${db.users.map((u) => `<tr><td>${E(u.name)}<br><span class="mut">${E(u.email)}</span></td><td>${db.events.filter((e) => e.uid == u.id).length} соб.</td><td>${u.role == "admin" ? "админ" : `<button class="sm ${u.blocked ? "" : "d"}" onclick="blockU(${u.id})">${u.blocked ? "Разблокировать" : "Заблокировать"}</button>`}</td></tr>`).join("")}</table></div></div>
<div class="card"><h3>Подрядчики</h3><div class="wrap"><table>${db.vendors.map((v) => `<tr><td>${E(v.name)}<br><span class="mut">${VC[v.category]}</span></td><td><label style="margin:0"><input type="checkbox" style="width:auto;min-height:0" ${v.active ? "checked" : ""} onchange="req(()=>{db.vendors.find(a=>a.id==${v.id}).active=this.checked},50)"> активен</label><br><label style="margin:0"><input type="checkbox" style="width:auto;min-height:0" ${v.verified ? "checked" : ""} onchange="req(()=>{db.vendors.find(a=>a.id==${v.id}).verified=this.checked},50)"> проверен</label></td></tr>`).join("")}</table></div>
<div class="row" style="margin-top:8px"><input id="vn" placeholder="Название нового подрядчика"><select id="vc">${Object.entries(
          VC,
        )
          .map((x) => `<option value="${x[0]}">${x[1]}</option>`)
          .join(
            "",
          )}</select><input id="vp" type="number" placeholder="Цена от"><button class="p" onclick="addV()">Добавить</button></div></div>
<div class="card"><button class="d" onclick="if(confirm('Сбросить демо-данные?')){db=seed();save();location.hash='login';S.user=null;render()}">Сбросить демо-данные</button></div>`;
      }
      async function blockU(id) {
        await req(() => {
          const u = db.users.find((a) => a.id == id);
          u.blocked = !u.blocked;
        }, 50);
        render();
      }
      async function addV() {
        if (!id_("vn").value) return;
        await req(() => {
          db.vendors.push({
            id: nid(db.vendors),
            category: id_("vc").value,
            name: id_("vn").value,
            city: "Бишкек",
            district: "Первомайский",
            price_from: +id_("vp").value || 0,
            price_to: 0,
            phone: "+996555000000",
            verified: false,
            active: true,
          });
        }, 50);
        render();
      }
      render();
    </script>
  </body>
</html>
